services:
  database:
    image: postgres:16.15-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medimate_dev_password}
      POSTGRES_USER: ${POSTGRES_USER:-medimate_user}
      POSTGRES_DB: ${POSTGRES_DB:-medimate}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medimate_user} -d ${POSTGRES_DB:-medimate}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.12-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  docling-serve:
    image: ghcr.io/ds4sd/docling-serve:v1.38.2
    restart: always

  app:
    build:
      context: .
      dockerfile: Containerfile
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      docling-serve:
        condition: service_started
    volumes:
      - app_storage:/app/storage
      - app_data:/app/legacy_uploads:ro
    ports:
      - "3000:3000"
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-medimate_user}:${POSTGRES_PASSWORD:-medimate_dev_password}@database:5432/${POSTGRES_DB:-medimate}
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      MEDIMATE_STORAGE_DIR: /app/storage

volumes:
  postgres_data:
  redis_data:
  app_storage:
  app_data:
