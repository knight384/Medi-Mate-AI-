services:
  database:
    image: postgres:16.15-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-open-health}
      APP_DB_USER: ${APP_DB_USER:-medimate_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
      OWNER_DB_USER: ${OWNER_DB_USER:-medimate_owner}
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD:?Set OWNER_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-open-health}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.12-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  docling-serve:
    image: ghcr.io/docling-project/docling-serve:v1.38.2@sha256:8a5fbc993da9dec17c53880e2445834591ad26800ef698ca64096bef29671808
    restart: always

  app:
    build:
      context: .
      dockerfile: Containerfile
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      docling-serve:
        condition: service_started
    volumes:
      - app_storage:/app/storage
      - app_data:/app/legacy_uploads:ro
    ports:
      - "3000:3000"
    restart: always
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER:-medimate_app}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@database:5432/${POSTGRES_DB:-open-health}
      MIGRATION_DATABASE_URL: postgresql://${OWNER_DB_USER:-medimate_owner}:${OWNER_DB_PASSWORD:?Set OWNER_DB_PASSWORD}@database:5432/${POSTGRES_DB:-open-health}
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      MEDIMATE_STORAGE_DIR: /app/storage

volumes:
  postgres_data:
  redis_data:
  app_storage:
  app_data:
